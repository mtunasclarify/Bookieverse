<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookieVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0b1120;--surface:#111927;--card:#162032;--card-hover:#1a2840;
            --border:#1f3050;--border-hi:#2d4870;
            --green:#00d67a;--green-dim:#00a85f;--green-glow:rgba(0,214,122,0.15);
            --gold:#f5a623;--red:#ff4560;--blue:#4a9eff;--purple:#8b5cf6;
            --text:#ddeeff;--text-muted:#6b90b8;--text-dim:#3d607e;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
            background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(0,100,255,.07),transparent),
            radial-gradient(ellipse 60% 40% at 90% 100%,rgba(0,214,122,.05),transparent);}
        .app-shell{display:flex;min-height:100vh;}
        .sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
            display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
        .main{flex:1;min-width:0;}
        .content-area{max-width:960px;margin:0 auto;padding:28px 24px;}
        .sidebar-logo{padding:24px 20px 16px;border-bottom:1px solid var(--border);}
        .logo-text{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;
            background:linear-gradient(135deg,var(--green),#00a8ff);-webkit-background-clip:text;
            -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
        .logo-sub{font-size:10px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
        .sidebar-user{padding:16px 20px;border-bottom:1px solid var(--border);}
        .sidebar-username{font-weight:700;font-size:15px;}
        .sidebar-stats{font-size:12px;color:var(--text-muted);margin-top:4px;}
        .sidebar-balance{margin-top:12px;padding:12px;background:var(--card);border-radius:10px;border:1px solid var(--border);}
        .bal-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
        .bal-amount{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:var(--green);line-height:1.1;}
        .bal-pl{font-size:13px;font-weight:600;margin-top:2px;}
        .bal-pl.pos{color:var(--green);}.bal-pl.neg{color:var(--red);}
        .sidebar-nav{padding:12px 0;flex:1;}
        .nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:14px;font-weight:500;
            color:var(--text-muted);cursor:pointer;transition:all .15s;border-left:3px solid transparent;user-select:none;}
        .nav-item:hover{color:var(--text);background:rgba(255,255,255,.03);}
        .nav-item.active{color:var(--green);background:var(--green-glow);border-left-color:var(--green);}
        .nav-icon{width:18px;text-align:center;font-size:16px;}
        .sidebar-bottom{padding:16px 20px;border-top:1px solid var(--border);}
        .logout-btn{width:100%;padding:10px;background:transparent;border:1px solid var(--border);
            color:var(--text-muted);border-radius:8px;cursor:pointer;font-family:'Barlow',sans-serif;
            font-size:13px;font-weight:600;transition:all .15s;}
        .logout-btn:hover{border-color:var(--red);color:var(--red);background:rgba(255,69,96,.05);}
        .topbar{display:none;align-items:center;justify-content:space-between;padding:12px 16px;
            background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
        .topbar-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--green);}
        .topbar-bal{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--green);}
        .mobile-nav{display:none;overflow-x:auto;padding:8px 12px;background:var(--surface);
            border-bottom:1px solid var(--border);gap:6px;scrollbar-width:none;}
        .mobile-nav::-webkit-scrollbar{display:none;}
        .mob-tab{flex-shrink:0;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;
            cursor:pointer;color:var(--text-muted);border:1px solid var(--border);white-space:nowrap;transition:all .15s;}
        .mob-tab.active{background:var(--green);color:#000;border-color:var(--green);}
        .page-header{margin-bottom:28px;}
        .page-title{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;letter-spacing:.5px;}
        .page-subtitle{font-size:14px;color:var(--text-muted);margin-top:4px;}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 24px;
            margin-bottom:14px;transition:border-color .2s,box-shadow .2s;}
        .card:hover{border-color:var(--border-hi);box-shadow:0 4px 24px rgba(0,0,0,.3);}
        .card-glow{box-shadow:0 0 0 1px var(--green-glow),0 4px 24px rgba(0,214,122,.08);}
        .badge{display:inline-block;padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
        .badge-spread{background:rgba(139,92,246,.2);color:#c4b5fd;border:1px solid rgba(139,92,246,.3);}
        .badge-moneyline{background:rgba(74,158,255,.2);color:#93c5fd;border:1px solid rgba(74,158,255,.3);}
        .badge-total{background:rgba(245,166,35,.2);color:#fbbf24;border:1px solid rgba(245,166,35,.3);}
        .badge-prop{background:rgba(236,72,153,.2);color:#f9a8d4;border:1px solid rgba(236,72,153,.3);}
        .badge-private{background:rgba(139,92,246,.2);color:#c4b5fd;border:1px solid rgba(139,92,246,.3);}
        .badge-nba{background:rgba(0,214,122,.15);color:var(--green);border:1px solid rgba(0,214,122,.3);}
        .badge-nfl{background:rgba(245,166,35,.15);color:var(--gold);border:1px solid rgba(245,166,35,.3);}
        .fill-bar-wrap{margin-top:10px;}
        .fill-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:5px;}
        .fill-bar-track{height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
        .fill-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-dim),var(--green));transition:width .4s ease;}
        .fill-bar-fill.partial{background:linear-gradient(90deg,var(--gold),#ffdc70);}
        .fill-bar-fill.full{background:var(--text-dim);}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;
            border:none;border-radius:9px;font-family:'Barlow',sans-serif;font-size:14px;font-weight:700;
            cursor:pointer;transition:all .15s;letter-spacing:.3px;}
        .btn-primary{background:var(--green);color:#000;}
        .btn-primary:hover{background:#00f090;box-shadow:0 4px 16px rgba(0,214,122,.3);transform:translateY(-1px);}
        .btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
        .btn-secondary:hover{border-color:var(--border-hi);background:var(--card-hover);}
        .btn-danger{background:rgba(255,69,96,.15);color:var(--red);border:1px solid rgba(255,69,96,.3);}
        .btn-danger:hover{background:rgba(255,69,96,.25);}
        .btn-sm{padding:7px 14px;font-size:13px;}.btn-lg{padding:14px 28px;font-size:16px;}
        .btn-full{width:100%;}
        .btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important;}
        .form-group{margin-bottom:16px;}
        label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
        input,select,textarea{width:100%;padding:12px 14px;background:var(--bg);color:var(--text);
            border:1px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:15px;transition:border-color .15s;}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(0,214,122,.1);}
        select option{background:var(--surface);}
        .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
            backdrop-filter:blur(4px);z-index:500;align-items:center;justify-content:center;}
        .modal-overlay.open{display:flex;}
        .modal-box{background:var(--surface);border:1px solid var(--border-hi);border-radius:16px;
            padding:28px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto;
            box-shadow:0 20px 60px rgba(0,0,0,.5);}
        .modal-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;margin-bottom:20px;}
        .modal-footer{display:flex;gap:10px;margin-top:20px;}
        .toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;}
        .toast{padding:14px 20px;border-radius:10px;border:1px solid;font-size:14px;font-weight:600;
            min-width:260px;max-width:380px;animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;cursor:pointer;}
        .toast.success{background:rgba(0,214,122,.15);border-color:rgba(0,214,122,.4);color:#6fffc7;}
        .toast.error{background:rgba(255,69,96,.15);border-color:rgba(255,69,96,.4);color:#ff8fa5;}
        .toast.info{background:rgba(74,158,255,.15);border-color:rgba(74,158,255,.4);color:#93c5fd;}
        @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
        @keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(40px)}}
        .skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%);
            background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .skeleton-line{height:14px;margin:8px 0;}
        .skeleton-title{height:22px;margin:8px 0;width:60%;}
        .skeleton-card{padding:20px 24px;border:1px solid var(--border);border-radius:14px;margin-bottom:14px;}
        .line-card{display:flex;gap:20px;align-items:flex-start;}
        .line-card-info{flex:1;min-width:0;}
        .line-card-amount{flex-shrink:0;text-align:right;}
        .line-game{font-size:18px;font-weight:700;margin:8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .line-side{color:var(--text-muted);font-size:14px;}
        .line-by{color:var(--text-dim);font-size:12px;margin-top:6px;}
        .line-amount-num{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:800;color:var(--green);line-height:1;}
        .lb-row{display:flex;align-items:center;gap:16px;}
        .lb-rank{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;min-width:44px;text-align:center;}
        .lb-name{font-size:17px;font-weight:700;}
        .lb-record{font-size:13px;color:var(--text-muted);margin-top:2px;}
        .lb-profit{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;margin-left:auto;}
        .bet-status{padding:4px 12px;border-radius:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
        .bet-status.pending{background:rgba(245,166,35,.15);color:var(--gold);border:1px solid rgba(245,166,35,.3);}
        .bet-status.won{background:rgba(0,214,122,.15);color:var(--green);border:1px solid rgba(0,214,122,.3);}
        .bet-status.lost{background:rgba(255,69,96,.15);color:var(--red);border:1px solid rgba(255,69,96,.3);}
        .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
            background-image:radial-gradient(ellipse 100% 80% at 50% 0%,rgba(0,100,255,.08),transparent 60%),
            radial-gradient(ellipse 60% 60% at 80% 100%,rgba(0,214,122,.07),transparent 60%);}
        .login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 44px;
            width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,.4);}
        .login-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;
            background:linear-gradient(135deg,var(--green),#00a8ff);-webkit-background-clip:text;
            -webkit-text-fill-color:transparent;background-clip:text;text-align:center;line-height:1;}
        .login-tagline{text-align:center;color:var(--text-muted);font-size:14px;margin-top:6px;margin-bottom:36px;}
        .login-tabs{display:flex;background:var(--card);border-radius:10px;padding:4px;margin-bottom:24px;}
        .login-tab{flex:1;text-align:center;padding:10px;border-radius:7px;font-size:14px;font-weight:600;
            cursor:pointer;transition:all .15s;color:var(--text-muted);}
        .login-tab.active{background:var(--green);color:#000;}
        .empty-state{text-align:center;padding:80px 20px;}
        .empty-icon{font-size:56px;margin-bottom:16px;}
        .empty-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--text-muted);}
        .empty-desc{font-size:14px;color:var(--text-dim);margin-top:8px;}
        .advanced-panel{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:20px;}
        .advanced-title{font-size:13px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px;}
        .checkbox-row{display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:12px;}
        .checkbox-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);}
        .checkbox-row span{font-size:14px;font-weight:500;color:var(--text);}
        .wr-bar{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:6px;}
        .wr-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-dim),var(--green));}
        @media(max-width:768px){
            .sidebar{display:none!important;}.topbar{display:flex;}.mobile-nav{display:flex;}
            .content-area{padding:20px 16px;}
            .form-grid-2,.form-grid-3{grid-template-columns:1fr;}
            .line-card{flex-direction:column;}.line-card-amount{text-align:left;}
        }
        @media(max-width:440px){.login-box{padding:32px 24px;}}
    </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="modal-overlay" id="betAmountModal">
    <div class="modal-box">
        <div class="modal-title">Place Your Bet</div>
        <div id="betModalInfo" style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:20px;font-size:14px;color:var(--text-muted);line-height:1.8;"></div>
        <div class="form-group">
            <label>Bet Amount ($)</label>
            <input type="number" id="betAmountInput" placeholder="Enter amount..." min="1" step="1">
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary btn-full" onclick="confirmBetAmount()">Place Bet</button>
            <button class="btn btn-secondary" onclick="closeBetModal()">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
        <div class="modal-title" id="confirmTitle">Confirm</div>
        <div id="confirmBody" style="color:var(--text-muted);font-size:15px;margin-bottom:20px;"></div>
        <div class="modal-footer">
            <button class="btn btn-danger btn-full" id="confirmOkBtn">Confirm</button>
            <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="createGroupModal">
    <div class="modal-box">
        <div class="modal-title">Create Group</div>
        <div class="form-group"><label>Group Name</label><input type="text" id="groupName" placeholder="My Betting Crew"></div>
        <div class="form-group"><label>Description (optional)</label><textarea id="groupDesc" rows="3" placeholder="What's this group about?"></textarea></div>
        <div class="modal-footer">
            <button class="btn btn-primary btn-full" onclick="saveGroup()">Create Group</button>
            <button class="btn btn-secondary" onclick="closeModal('createGroupModal')">Cancel</button>
        </div>
    </div>
</div>

<div id="root"></div>
<script>
const API=window.location.origin+'/api';
let token=localStorage.getItem('token');
let user=null,view='marketplace',propTypes={},linesCache=[];
let _betResolve=null,_confirmResolve=null;

function toast(msg,type='info'){
    const ct=document.getElementById('toastContainer');
    const t=document.createElement('div');
    t.className='toast '+type;t.textContent=msg;t.onclick=()=>t.remove();
    ct.appendChild(t);setTimeout(()=>t.remove(),3000);
}
function promptBetAmount(info,max){
    return new Promise(r=>{
        _betResolve=r;
        document.getElementById('betModalInfo').innerHTML=info;
        const inp=document.getElementById('betAmountInput');
        inp.value='';inp.max=max;inp.placeholder='Max $'+max;
        document.getElementById('betAmountModal').classList.add('open');
        setTimeout(()=>inp.focus(),100);
    });
}
function confirmBetAmount(){
    const val=parseFloat(document.getElementById('betAmountInput').value);
    const max=parseFloat(document.getElementById('betAmountInput').max);
    if(isNaN(val)||val<=0){toast('Enter a valid amount','error');return;}
    if(val>max){toast('Max bet is $'+max,'error');return;}
    closeBetModal();
    if(_betResolve){_betResolve(val);_betResolve=null;}
}
function closeBetModal(){
    document.getElementById('betAmountModal').classList.remove('open');
    if(_betResolve){_betResolve(null);_betResolve=null;}
}
document.getElementById('betAmountInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmBetAmount();});
function showConfirm(title,body){
    return new Promise(r=>{
        _confirmResolve=r;
        document.getElementById('confirmTitle').textContent=title;
        document.getElementById('confirmBody').textContent=body;
        document.getElementById('confirmOkBtn').onclick=()=>{closeConfirmModal();if(_confirmResolve){_confirmResolve(true);_confirmResolve=null;}};
        document.getElementById('confirmModal').classList.add('open');
    });
}
function closeConfirmModal(){
    document.getElementById('confirmModal').classList.remove('open');
    if(_confirmResolve){_confirmResolve(false);_confirmResolve=null;}
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.addEventListener('click',e=>{
    if(e.target.classList.contains('modal-overlay')){
        e.target.classList.remove('open');
        if(_betResolve){_betResolve(null);_betResolve=null;}
        if(_confirmResolve){_confirmResolve(false);_confirmResolve=null;}
    }
});
function skeletonCards(n=3){
    return Array(n).fill(0).map(()=>`<div class="skeleton-card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line" style="width:40%"></div></div>`).join('');
}
async function doLogin(){
    const u=document.getElementById('loginUsername').value.trim(),p=document.getElementById('loginPassword').value;
    if(!u||p.length<6){toast('Username required. Password 6+ chars.','error');return;}
    const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Logging in...';
    try{
        const res=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        if(!res.ok){const e=await res.json();toast('Login failed: '+(e.detail||'Invalid credentials'),'error');return;}
        const data=await res.json();token=data.token;localStorage.setItem('token',token);user=data.user;
        await loadPropTypes();renderApp();
    }catch(e){toast('Connection error','error');}finally{btn.disabled=false;btn.textContent='Login';}
}
async function doRegister(){
    const u=document.getElementById('loginUsername').value.trim(),p=document.getElementById('loginPassword').value;
    if(!u||p.length<6){toast('Username required. Password 6+ chars.','error');return;}
    const btn=document.getElementById('registerBtn');btn.disabled=true;btn.textContent='Creating...';
    try{
        const res=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        if(!res.ok){const e=await res.json();toast('Registration failed: '+(e.detail||'Username taken'),'error');return;}
        const data=await res.json();token=data.token;localStorage.setItem('token',token);user=data.user;
        await loadPropTypes();renderApp();
    }catch(e){toast('Connection error','error');}finally{btn.disabled=false;btn.textContent='Register';}
}
async function loadUser(){
    try{
        const res=await fetch(API+'/user?token='+token);
        if(!res.ok){localStorage.removeItem('token');token=null;user=null;location.reload();return;}
        user=await res.json();
    }catch(e){localStorage.removeItem('token');token=null;user=null;location.reload();}
}
async function loadPropTypes(){const res=await fetch(API+'/prop-types');propTypes=await res.json();}
async function logout(){
    const ok=await showConfirm('Log out?','You will need to log back in.');
    if(!ok)return;
    localStorage.removeItem('token');token=null;user=null;location.reload();
}
function updateSidebarBalance(){
    if(!user)return;
    const b=document.getElementById('sidebarBalance');
    if(b)b.textContent='$'+user.balance.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});
    const pl=document.getElementById('sidebarPL');
    if(pl){pl.textContent=(user.profit>=0?'+':'')+'$'+user.profit.toLocaleString()+' P/L';pl.className='bal-pl '+(user.profit>=0?'pos':'neg');}
    const tb=document.getElementById('topbarBalance');
    if(tb)tb.textContent='$'+user.balance.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});
}
async function loadLines(){
    document.getElementById('content').innerHTML=skeletonCards(4);
    const res=await fetch(API+'/lines?token='+token);
    const lines=await res.json();
    linesCache=lines;
    if(!lines.length)return'<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No Lines Available</div><div class="empty-desc">Be the first to set a line</div></div>';
    let html=`<div class="page-header"><div class="page-title">Marketplace</div><div class="page-subtitle">${lines.length} open line${lines.length!==1?'s':''} available</div></div>`;
    for(const line of lines){
        const avail=line.amount-(line.total_action||0);
        const pct=Math.min(100,Math.round((line.total_action||0)/line.amount*100));
        const isFull=avail<=0;
        const sp=line.sport||'';
        const sBadge=sp==='NBA'?'badge-nba':sp==='NFL'?'badge-nfl':'badge-prop';
        const tBadge=line.type==='spread'?'badge-spread':line.type==='moneyline'?'badge-moneyline':'badge-total';
        const barCls=pct===100?'full':pct>0?'partial':'';
        html+=`<div class="card ${isFull?'':'card-glow'}">
            <div class="line-card">
                <div class="line-card-info">
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <span class="badge ${tBadge}">${line.type}</span>
                        <span class="badge ${sBadge}">${sp}</span>
                        ${line.is_private?'<span class="badge badge-private">Private</span>':''}
                    </div>
                    <div class="line-game">${line.game}</div>
                    <div class="line-side">${line.side==='over'||line.side==='under'?line.side.toUpperCase():line.side.charAt(0).toUpperCase()+line.side.slice(1)}
                        ${line.type!=='moneyline'?`<strong style="color:var(--text)"> ${line.value>0?'+':''}${line.value}</strong>`:''}
                    </div>
                    <div class="line-by">by @${line.bookie_name}${line.max_bet_per_user?' · Max $'+line.max_bet_per_user+'/user':''}</div>
                    <div class="fill-bar-wrap">
                        <div class="fill-bar-label"><span>${pct}% filled</span><span>${isFull?'Fully matched':'$'+avail.toFixed(0)+' open'}</span></div>
                        <div class="fill-bar-track"><div class="fill-bar-fill ${barCls}" style="width:${pct}%"></div></div>
                    </div>
                </div>
                <div class="line-card-amount">
                    <div class="line-amount-num">$${line.amount}</div>
                    <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="takeLine(${line.id})" ${isFull?'disabled':''}>
                        ${isFull?'Filled':'Take Bet'}
                    </button>
                </div>
            </div>
        </div>`;
    }
    return html;
}
async function takeLine(lineId){
    const line=linesCache.find(l=>l.id===lineId);
    if(!line){toast('Line not found','error');return;}
    const available=line.amount-(line.total_action||0);
    const maxPerUser=line.max_bet_per_user||999999;
    const maxBet=Math.min(available,maxPerUser,user.balance);
    if(maxBet<=0){toast('No available action on this line','error');return;}
    const amount=await promptBetAmount(
        `<strong style="color:var(--text)">${line.game}</strong><br>Type: ${line.type.toUpperCase()} &middot; Side: ${line.side} ${line.value>0?'+':''}${line.value}<br>Available: <strong style="color:var(--green)">$${available.toFixed(0)}</strong> &middot; Balance: $${user.balance.toLocaleString()}`,
        maxBet
    );
    if(!amount)return;
    try{
        const res=await fetch(API+'/lines/take?token='+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({line_id:lineId,amount})});
        if(res.ok){const data=await res.json();toast('Bet placed — $'+data.amount+'!','success');await loadUser();updateSidebarBalance();changeView('marketplace');}
        else{const e=await res.json();toast(e.detail||'Error placing bet','error');}
    }catch(e){toast('Connection error','error');}
}

    else if(view==='shop')content=await renderShop();
    else if(view==='search')content=await renderUserSearch();
    else if(view==='admin')content=await renderAdmin();
    const ct=document.getElementById('content');if(ct)ct.innerHTML=content;
}
function changeView(v){view=v;renderApp();}
function renderLogin(){
    document.getElementById('root').innerHTML=`
        <div class="login-screen"><div class="login-box">
            <div class="login-logo">BookieVerse</div>
            <div class="login-tagline">PvP Sportsbook</div>
            <div class="form-group"><label>Username</label><input id="loginUsername" placeholder="Enter username" autofocus></div>
            <div class="form-group"><label>Password</label><input id="loginPassword" type="password" placeholder="6+ characters"></div>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px;">
                <button id="loginBtn" class="btn btn-primary btn-lg btn-full" onclick="doLogin()">Login</button>
                <button id="registerBtn" class="btn btn-secondary btn-lg btn-full" onclick="doRegister()">Register</button>
            </div>

        </div></div>`;
    document.getElementById('loginUsername').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('loginPassword').focus();});
    document.getElementById('loginPassword').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click();});
}
function switchLoginTab(isLogin){
    document.getElementById('tabLogin').classList.toggle('active',isLogin);
    document.getElementById('tabRegister').classList.toggle('active',!isLogin);
}
if(!token){renderLogin();}else{(async()=>{await loadPropTypes();renderApp();})();}
</script>
</body>
</html>
