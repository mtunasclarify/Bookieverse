<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookieVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0b1120;--surface:#111927;--card:#162032;--card-hover:#1a2840;--card2:#1a2c44;
            --border:#1f3050;--border-hi:#2d4870;
            --green:#00d67a;--green-dim:#00a85f;--green-glow:rgba(0,214,122,0.15);
            --gold:#f5a623;--red:#ff4560;--orange:#ff8c42;--blue:#4a9eff;--purple:#8b5cf6;
            --text:#ddeeff;--text-muted:#6b90b8;--text-dim:#3d607e;
            --muted:#6b90b8;--dim:#3d607e;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
            background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(0,100,255,.07),transparent),
            radial-gradient(ellipse 60% 40% at 90% 100%,rgba(0,214,122,.05),transparent);}
        .app-shell{display:flex;min-height:100vh;}
        .sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
            display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
        .main{flex:1;min-width:0;}
        .content-area{max-width:960px;margin:0 auto;padding:28px 24px;}
        .sidebar-logo{padding:24px 20px 16px;border-bottom:1px solid var(--border);}
        .logo-text{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;
            background:linear-gradient(135deg,var(--green),#00a8ff);-webkit-background-clip:text;
            -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
        .logo-sub{font-size:10px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
        .sidebar-user{padding:16px 20px;border-bottom:1px solid var(--border);}
        .sidebar-username{font-weight:700;font-size:15px;}
        .sidebar-stats{font-size:12px;color:var(--text-muted);margin-top:4px;}
        .sidebar-balance{margin-top:12px;padding:12px;background:var(--card);border-radius:10px;border:1px solid var(--border);}
        .bal-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
        .bal-amount{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:var(--green);line-height:1.1;}
        .bal-pl{font-size:13px;font-weight:600;margin-top:2px;}
        .bal-pl.pos{color:var(--green);}.bal-pl.neg{color:var(--red);}
        .sidebar-nav{padding:12px 0;flex:1;}
        .nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:14px;font-weight:500;
            color:var(--text-muted);cursor:pointer;transition:all .15s;border-left:3px solid transparent;user-select:none;}
        .nav-item:hover{color:var(--text);background:rgba(255,255,255,.03);}
        .nav-item.active{color:var(--green);background:var(--green-glow);border-left-color:var(--green);}
        .nav-icon{width:18px;text-align:center;font-size:16px;}
        .sidebar-bottom{padding:16px 20px;border-top:1px solid var(--border);}
        .logout-btn{width:100%;padding:10px;background:transparent;border:1px solid var(--border);
            color:var(--text-muted);border-radius:8px;cursor:pointer;font-family:'Barlow',sans-serif;
            font-size:13px;font-weight:600;transition:all .15s;}
        .logout-btn:hover{border-color:var(--red);color:var(--red);background:rgba(255,69,96,.05);}
        .topbar{display:none;align-items:center;justify-content:space-between;padding:12px 16px;
            background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
        .topbar-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--green);}
        .topbar-bal{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--green);}
        .mobile-nav{display:none;overflow-x:auto;padding:8px 12px;background:var(--surface);
            border-bottom:1px solid var(--border);gap:6px;scrollbar-width:none;}
        .mobile-nav::-webkit-scrollbar{display:none;}
        .mob-tab{flex-shrink:0;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;
            cursor:pointer;color:var(--text-muted);border:1px solid var(--border);white-space:nowrap;transition:all .15s;}
        .mob-tab.active{background:var(--green);color:#000;border-color:var(--green);}
        .page-header{margin-bottom:28px;}
        .page-title{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;letter-spacing:.5px;}
        .page-subtitle{font-size:14px;color:var(--text-muted);margin-top:4px;}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 24px;
            margin-bottom:14px;transition:border-color .2s,box-shadow .2s;}
        .card:hover{border-color:var(--border-hi);box-shadow:0 4px 24px rgba(0,0,0,.3);}
        .card-glow{box-shadow:0 0 0 1px var(--green-glow),0 4px 24px rgba(0,214,122,.08);}
        .badge{display:inline-block;padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
        .badge-spread{background:rgba(139,92,246,.2);color:#c4b5fd;border:1px solid rgba(139,92,246,.3);}
        .badge-moneyline{background:rgba(74,158,255,.2);color:#93c5fd;border:1px solid rgba(74,158,255,.3);}
        .badge-total{background:rgba(245,166,35,.2);color:#fbbf24;border:1px solid rgba(245,166,35,.3);}
        .badge-prop{background:rgba(236,72,153,.2);color:#f9a8d4;border:1px solid rgba(236,72,153,.3);}
        .badge-private{background:rgba(139,92,246,.2);color:#c4b5fd;border:1px solid rgba(139,92,246,.3);}
        .badge-nba{background:rgba(0,214,122,.15);color:var(--green);border:1px solid rgba(0,214,122,.3);}
        .badge-nfl{background:rgba(245,166,35,.15);color:var(--gold);border:1px solid rgba(245,166,35,.3);}
        .fill-bar-wrap{margin-top:10px;}
        .fill-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:5px;}
        .fill-bar-track{height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
        .fill-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-dim),var(--green));transition:width .4s ease;}
        .fill-bar-fill.partial{background:linear-gradient(90deg,var(--gold),#ffdc70);}
        .fill-bar-fill.full{background:var(--text-dim);}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;
            border:none;border-radius:9px;font-family:'Barlow',sans-serif;font-size:14px;font-weight:700;
            cursor:pointer;transition:all .15s;letter-spacing:.3px;}
        .btn-primary{background:var(--green);color:#000;}
        .btn-primary:hover{background:#00f090;box-shadow:0 4px 16px rgba(0,214,122,.3);transform:translateY(-1px);}
        .btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
        .btn-secondary:hover{border-color:var(--border-hi);background:var(--card-hover);}
        .btn-outline{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
        .btn-outline:hover{border-color:var(--green);color:var(--green);}
        .btn-danger{background:rgba(255,69,96,.15);color:var(--red);border:1px solid rgba(255,69,96,.3);}
        .btn-danger:hover{background:rgba(255,69,96,.25);}
        .btn-sm{padding:7px 14px;font-size:13px;}.btn-lg{padding:14px 28px;font-size:16px;}
        .btn-full{width:100%;}
        .btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important;}
        .form-group{margin-bottom:16px;}
        label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
        input,select,textarea{width:100%;padding:12px 14px;background:var(--bg);color:var(--text);
            border:1px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:15px;transition:border-color .15s;}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(0,214,122,.1);}
        select option{background:var(--surface);}
        .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
            backdrop-filter:blur(4px);z-index:500;align-items:center;justify-content:center;}
        .modal-overlay.open{display:flex;}
        .modal-box{background:var(--surface);border:1px solid var(--border-hi);border-radius:16px;
            padding:28px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto;
            box-shadow:0 20px 60px rgba(0,0,0,.5);}
        .modal-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;margin-bottom:20px;}
        .modal-footer{display:flex;gap:10px;margin-top:20px;}
        /* ─── NOTIFICATIONS ─── */
        .notif-bell{position:relative;cursor:pointer;padding:10px 18px;display:flex;align-items:center;gap:8px;
            color:var(--muted);font-size:20px;transition:color .15s;border-top:1px solid var(--border);}
        .notif-bell:hover{color:var(--text);}
        .notif-badge{position:absolute;top:6px;left:30px;background:var(--orange);color:#000;
            font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;
            display:flex;align-items:center;justify-content:center;padding:0 4px;
            animation:badgePop .3s ease;}
        @keyframes badgePop{from{transform:scale(0)}to{transform:scale(1)}}
        .notif-drawer{position:fixed;top:0;right:-400px;width:360px;max-width:95vw;height:100vh;
            background:var(--surface);border-left:1px solid var(--border);z-index:1000;
            display:flex;flex-direction:column;transition:right .3s cubic-bezier(.4,0,.2,1);
            box-shadow:-8px 0 40px rgba(0,0,0,.5);}
        .notif-drawer.open{right:0;}
        .notif-drawer-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);
            display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
        .notif-drawer-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:1px;}
        .notif-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;
            padding:4px 8px;border-radius:6px;transition:color .15s;}
        .notif-close:hover{color:var(--text);}
        .notif-list{flex:1;overflow-y:auto;padding:8px;}
        .notif-item{padding:14px 16px;border-radius:10px;margin-bottom:6px;
            border:1px solid var(--border);transition:background .15s;}
        .notif-item:hover{background:var(--card2);}
        .notif-item.unread{background:var(--card);border-left:3px solid var(--orange);}
        .notif-item-title{font-size:14px;font-weight:700;margin-bottom:3px;}
        .notif-item-body{font-size:12px;color:var(--muted);}
        .notif-item-time{font-size:11px;color:var(--dim);margin-top:4px;}
        .notif-empty{text-align:center;padding:60px 20px;color:var(--muted);}
        .notif-overlay{position:fixed;inset:0;z-index:999;display:none;}
        .notif-overlay.open{display:block;}
        /* ─── TOAST ─── */
        .toast-container{position:fixed;bottom:28px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
        .toast{pointer-events:all;padding:14px 20px;border-radius:10px;border:1px solid;font-size:14px;font-weight:600;
            min-width:260px;max-width:380px;animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;cursor:pointer;}
        .toast.success{background:rgba(0,214,122,.15);border-color:rgba(0,214,122,.4);color:#6fffc7;}
        .toast.error{background:rgba(255,69,96,.15);border-color:rgba(255,69,96,.4);color:#ff8fa5;}
        .toast.info{background:rgba(74,158,255,.15);border-color:rgba(74,158,255,.4);color:#93c5fd;}
        @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
        @keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(40px)}}
        .skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%);
            background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .skeleton-line{height:14px;margin:8px 0;}
        .skeleton-title{height:22px;margin:8px 0;width:60%;}
        .skeleton-card{padding:20px 24px;border:1px solid var(--border);border-radius:14px;margin-bottom:14px;}
        .line-card{display:flex;gap:20px;align-items:flex-start;}
        .line-card-info{flex:1;min-width:0;}
        .line-card-amount{flex-shrink:0;text-align:right;}
        .line-game{font-size:18px;font-weight:700;margin:8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .line-side{color:var(--text-muted);font-size:14px;}
        .line-by{color:var(--text-dim);font-size:12px;margin-top:6px;}
        .line-amount-num{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:800;color:var(--green);line-height:1;}
        .lb-row{display:flex;align-items:center;gap:16px;}
        .lb-rank{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;min-width:44px;text-align:center;}
        .lb-name{font-size:17px;font-weight:700;}
        .lb-record{font-size:13px;color:var(--text-muted);margin-top:2px;}
        .lb-profit{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;margin-left:auto;}
        .bet-status{padding:4px 12px;border-radius:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
        .bet-status.pending{background:rgba(245,166,35,.15);color:var(--gold);border:1px solid rgba(245,166,35,.3);}
        .bet-status.won{background:rgba(0,214,122,.15);color:var(--green);border:1px solid rgba(0,214,122,.3);}
        .bet-status.lost{background:rgba(255,69,96,.15);color:var(--red);border:1px solid rgba(255,69,96,.3);}
        .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
            background-image:radial-gradient(ellipse 100% 80% at 50% 0%,rgba(0,100,255,.08),transparent 60%),
            radial-gradient(ellipse 60% 60% at 80% 100%,rgba(0,214,122,.07),transparent 60%);}
        .login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 44px;
            width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,.4);}
        .login-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;
            background:linear-gradient(135deg,var(--green),#00a8ff);-webkit-background-clip:text;
            -webkit-text-fill-color:transparent;background-clip:text;text-align:center;line-height:1;}
        .login-tagline{text-align:center;color:var(--text-muted);font-size:14px;margin-top:6px;margin-bottom:36px;}
        .login-tabs{display:flex;background:var(--card);border-radius:10px;padding:4px;margin-bottom:24px;}
        .login-tab{flex:1;text-align:center;padding:10px;border-radius:7px;font-size:14px;font-weight:600;
            cursor:pointer;transition:all .15s;color:var(--text-muted);}
        .login-tab.active{background:var(--green);color:#000;}
        .empty-state{text-align:center;padding:80px 20px;}
        .empty-icon{font-size:56px;margin-bottom:16px;}
        .empty-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--text-muted);}
        .empty-desc{font-size:14px;color:var(--text-dim);margin-top:8px;}
        .advanced-panel{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:20px;}
        .advanced-title{font-size:13px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px;}
        .checkbox-row{display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:12px;}
        .checkbox-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);}
        .checkbox-row span{font-size:14px;font-weight:500;color:var(--text);}
        .wr-bar{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:6px;}
        .wr-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-dim),var(--green));}
        @media(max-width:768px){
            .sidebar{display:none!important;}.topbar{display:flex;}.mobile-nav{display:flex;}
            .content-area{padding:20px 16px;}
            .form-grid-2,.form-grid-3{grid-template-columns:1fr;}
            .line-card{flex-direction:column;}.line-card-amount{text-align:left;}
        }
        @media(max-width:440px){.login-box{padding:32px 24px;}}
    </style>
</head>
<body>
<div class="notif-overlay" id="notifOverlay" onclick="closeNotifDrawer()"></div>
<div class="notif-drawer" id="notifDrawer">
    <div class="notif-drawer-header">
        <div class="notif-drawer-title">🔔 Notifications</div>
        <div style="display:flex;gap:8px;align-items:center;">
            <button class="btn btn-secondary" style="font-size:12px;padding:6px 12px;" onclick="markAllRead()">Mark all read</button>
            <button class="notif-close" onclick="closeNotifDrawer()">✕</button>
        </div>
    </div>
    <div class="notif-list" id="notifList"><div class="notif-empty"><div class="notif-empty-icon">🔔</div>No notifications yet</div></div>
</div>
<div class="toast-container" id="toastContainer"></div>

<div id="root"></div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
        <div class="modal-title" id="confirmTitle">Confirm</div>
        <div id="confirmBody" style="color:var(--text-muted);font-size:15px;margin-bottom:20px;"></div>
        <div class="modal-footer">
            <button class="btn btn-danger btn-full" id="confirmOkBtn">Confirm</button>
            <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="challengeModal">
    <div class="modal-box" style="max-width:540px;">
        <div class="modal-title">⚔️ Send Challenge</div>
        <div id="challengeTarget" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px;color:var(--text-muted);"></div>
        <div class="form-group"><label>Game</label>
            <select id="cGame"><option value="">Loading games...</option></select>
        </div>
        <div class="form-grid-2">
            <div class="form-group"><label>Bet Type</label>
                <select id="cType" onchange="onChallengeTypeChange()"><option value="spread">Spread</option><option value="moneyline">Moneyline</option><option value="total">Over / Under</option></select>
            </div>
            <div class="form-group"><label>Your Side</label>
                <select id="cSide"><option value="home">Home</option><option value="away">Away</option><option value="over">Over</option><option value="under">Under</option></select>
            </div>
        </div>
        <div class="form-grid-3">
            <div class="form-group" id="cValueField"><label>Line Value</label><input type="number" id="cValue" step="0.5" placeholder="-3.5"></div>
            <div class="form-group"><label>Your Odds</label><input type="number" id="cOdds" value="-110" step="1"></div>
            <div class="form-group"><label>Your Stake ($)</label><input type="number" id="cAmount" placeholder="100"></div>
        </div>
        <div id="cOddsPreview" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--text-muted);margin-bottom:12px;">Enter odds and amount to preview</div>
        <div class="form-group"><label>Trash Talk (optional)</label><input type="text" id="cMessage" placeholder="You're going down 😤" maxlength="100"></div>
        <div class="modal-footer">
            <button class="btn btn-primary btn-full" onclick="submitChallenge()">Send Challenge ⚔️</button>
            <button class="btn btn-secondary" onclick="closeModal('challengeModal')">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="createGroupModal">
    <div class="modal-box">
        <div class="modal-title">Create Group</div>
        <div class="form-group"><label>Group Name</label><input type="text" id="groupName" placeholder="My Betting Crew"></div>
        <div class="form-group"><label>Description (optional)</label><textarea id="groupDesc" rows="3" placeholder="What's this group about?"></textarea></div>
        <div class="modal-footer">
            <button class="btn btn-primary btn-full" onclick="saveGroup()">Create Group</button>
            <button class="btn btn-secondary" onclick="closeModal('createGroupModal')">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="inviteGroupModal">
    <div class="modal-box">
        <div class="modal-title">👥 Invite Member</div>
        <div id="inviteGroupLabel" style="color:var(--text-muted);font-size:14px;margin-bottom:16px;"></div>
        <div class="form-group"><label>Username</label><input type="text" id="inviteUsername" placeholder="Enter username" onkeydown="if(event.key==='Enter')submitInvite()"></div>
        <div class="modal-footer">
            <button class="btn btn-primary btn-full" onclick="submitInvite()">Add to Group</button>
            <button class="btn btn-secondary" onclick="closeModal('inviteGroupModal')">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="futureBetModal">
    <div class="modal-box">
        <div class="modal-title">🔮 Post Future Bet</div>
        <div id="futureBetLabel" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:14px;line-height:1.8;"></div>
        <div class="form-grid-2">
            <div class="form-group"><label>Your Odds (American)</label><input type="number" id="futureOdds" step="1" value="150" placeholder="150"></div>
            <div class="form-group"><label>Your Stake ($)</label><input type="number" id="futureAmount" step="1" placeholder="100"></div>
        </div>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;">Positive odds = underdog pick (you pay more to win). Negative = heavy favorite.</div>
        <div class="modal-footer">
            <button class="btn btn-primary btn-full" onclick="submitFutureBet()">Post to Marketplace</button>
            <button class="btn btn-secondary" onclick="closeModal('futureBetModal')">Cancel</button>
        </div>
    </div>
</div>

<!-- Bet Amount Modal -->
<div class="modal-overlay" id="betAmountModal">
    <div class="modal-box" style="max-width:420px;">
        <div class="modal-title">Place Bet</div>
        <div id="betModalInfo" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:14px;line-height:1.6;"></div>
        <div class="form-group">
            <label>Your Stake ($)</label>
            <input type="number" id="betAmountInput" step="1" min="1" placeholder="Enter amount">
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary btn-full" onclick="confirmBetAmount()">Confirm Bet</button>
            <button class="btn btn-secondary" onclick="closeBetModal()">Cancel</button>
        </div>
    </div>
</div>
<script>
const API=window.location.origin+'/api';
let token=localStorage.getItem('token');
let user=null,view='marketplace',propTypes={},linesCache=[],propsCache=[],gamesCache=[];
let _betResolve=null,_confirmResolve=null;

function toast(msg,type='info'){
    const ct=document.getElementById('toastContainer');
    const t=document.createElement('div');
    t.className='toast '+type;t.textContent=msg;t.onclick=()=>t.remove();
    ct.appendChild(t);setTimeout(()=>t.remove(),3000);
}
function promptBetAmount(info,max){
    return new Promise(r=>{
        _betResolve=r;
        document.getElementById('betModalInfo').innerHTML=info;
        const inp=document.getElementById('betAmountInput');
        inp.value='';inp.max=max;inp.placeholder='Max $'+max;
        document.getElementById('betAmountModal').classList.add('open');
        setTimeout(()=>inp.focus(),100);
    });
}
function confirmBetAmount(){
    const val=parseFloat(document.getElementById('betAmountInput').value);
    const max=parseFloat(document.getElementById('betAmountInput').max);
    if(isNaN(val)||val<=0){toast('Enter a valid amount','error');return;}
    if(val>max){toast('Max bet is $'+max,'error');return;}
    closeBetModal();
    if(_betResolve){_betResolve(val);_betResolve=null;}
}
function closeBetModal(){
    document.getElementById('betAmountModal').classList.remove('open');
    if(_betResolve){_betResolve(null);_betResolve=null;}
}
document.getElementById('betAmountInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmBetAmount();});
function showConfirm(title,body){
    return new Promise(r=>{
        _confirmResolve=r;
        document.getElementById('confirmTitle').textContent=title;
        document.getElementById('confirmBody').textContent=body;
        document.getElementById('confirmOkBtn').onclick=()=>{closeConfirmModal();if(_confirmResolve){_confirmResolve(true);_confirmResolve=null;}};
        document.getElementById('confirmModal').classList.add('open');
    });
}
function closeConfirmModal(){
    document.getElementById('confirmModal').classList.remove('open');
    if(_confirmResolve){_confirmResolve(false);_confirmResolve=null;}
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.addEventListener('click',e=>{
    if(e.target.classList.contains('modal-overlay')){
        e.target.classList.remove('open');
        if(_betResolve){_betResolve(null);_betResolve=null;}
        if(_confirmResolve){_confirmResolve(false);_confirmResolve=null;}
    }
});
function skeletonCards(n=3){
    return Array(n).fill(0).map(()=>`<div class="skeleton-card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line" style="width:40%"></div></div>`).join('');
}
async function doLogin(){
    const u=document.getElementById('loginUsername').value.trim(),p=document.getElementById('loginPassword').value;
    if(!u||p.length<6){toast('Username required. Password 6+ chars.','error');return;}
    const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Logging in...';
    try{
        const res=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        if(!res.ok){const e=await res.json();toast('Login failed: '+(e.detail||'Invalid credentials'),'error');return;}
        const data=await res.json();token=data.token;localStorage.setItem('token',token);user=data.user;
        await loadPropTypes();renderApp();startNotifPolling();
    }catch(e){toast('Connection error','error');}finally{btn.disabled=false;btn.textContent='Login';}
}
async function doRegister(){
    const u=document.getElementById('loginUsername').value.trim(),p=document.getElementById('loginPassword').value;
    if(!u||p.length<6){toast('Username required. Password 6+ chars.','error');return;}
    const btn=document.getElementById('registerBtn');btn.disabled=true;btn.textContent='Creating...';
    try{
        const res=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        if(!res.ok){const e=await res.json();toast('Registration failed: '+(e.detail||'Username taken'),'error');return;}
        const data=await res.json();token=data.token;localStorage.setItem('token',token);user=data.user;
        await loadPropTypes();renderApp();startNotifPolling();
    }catch(e){toast('Connection error','error');}finally{btn.disabled=false;btn.textContent='Register';}
}
async function loadUser(){
    try{
        const res=await fetch(API+'/user?token='+token);
        if(!res.ok){localStorage.removeItem('token');token=null;user=null;location.reload();return;}
        user=await res.json();
    }catch(e){localStorage.removeItem('token');token=null;user=null;location.reload();}
}
async function loadPropTypes(){const res=await fetch(API+'/prop-types');propTypes=await res.json();}
async function logout(){
    const ok=await showConfirm('Log out?','You will need to log back in.');
    if(!ok)return;
    localStorage.removeItem('token');token=null;user=null;location.reload();
}
function updateSidebarBalance(){
    if(!user)return;
    const b=document.getElementById('sidebarBalance');
    if(b)b.textContent='$'+user.balance.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});
    const pl=document.getElementById('sidebarPL');
    if(pl){pl.textContent=(user.profit>=0?'+':'')+'$'+user.profit.toLocaleString()+' P/L';pl.className='bal-pl '+(user.profit>=0?'pos':'neg');}
    const tb=document.getElementById('topbarBalance');
    if(tb)tb.textContent='$'+user.balance.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});
}
async function loadLines(){
    document.getElementById('content').innerHTML=skeletonCards(4);
    try{
        const res=await fetch(API+'/lines?token='+token);
        if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||'Failed to load marketplace');}
        const lines=await res.json();
        if(!Array.isArray(lines))throw new Error('Unexpected response from server');
        linesCache=lines;
        if(!lines.length)return'<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No Lines Available</div><div class="empty-desc">Be the first to set a line</div></div>';
    let html=`<div class="page-header"><div class="page-title">Marketplace</div><div class="page-subtitle">${lines.length} open line${lines.length!==1?'s':''} available</div></div>`;
    for(const line of lines){
        const avail=line.amount-(line.total_action||0);
        const availBettor=line.available_for_bettor||0;
        const pct=Math.min(100,Math.round((line.total_action||0)/line.amount*100));
        const isFull=avail<=0.01;
        const sp=line.sport||'';
        const sBadge=sp==='NBA'?'badge-nba':sp==='NFL'?'badge-nfl':'badge-prop';
        const tBadge=line.type==='spread'?'badge-spread':line.type==='moneyline'?'badge-moneyline':'badge-total';
        const barCls=pct===100?'full':pct>0?'partial':'';
        const odds=line.odds||-110;
        const oddsStr=odds>0?'+'+odds:odds;
        const oddsColor=odds>0?'var(--green)':'var(--text-muted)';
        html+=`<div class="card ${isFull?'':'card-glow'}">
            <div class="line-card">
                <div class="line-card-info">
                    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                        <span class="badge ${tBadge}">${line.type}</span>
                        <span class="badge ${sBadge}">${sp}</span>
                        <span style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:${oddsColor};letter-spacing:.5px;">${oddsStr}</span>
                        ${line.is_private?'<span class="badge badge-private">Private</span>':''}
                    </div>
                    <div class="line-game">${line.game}</div>
                    <div class="line-side">${line.side==='over'||line.side==='under'?line.side.toUpperCase():line.side.charAt(0).toUpperCase()+line.side.slice(1)}
                        ${line.type!=='moneyline'?`<strong style="color:var(--text)"> ${line.value>0?'+':''}${line.value}</strong>`:''}
                    </div>
                    <div class="line-by">by @${line.bookie_name}${line.max_bet_per_user?' · Max $'+line.max_bet_per_user+'/user':''}</div>
                    <div class="fill-bar-wrap">
                        <div class="fill-bar-label"><span>${pct}% filled</span><span>${isFull?'Fully matched':'$'+availBettor.toFixed(0)+' to wager'}</span></div>
                        <div class="fill-bar-track"><div class="fill-bar-fill ${barCls}" style="width:${pct}%"></div></div>
                    </div>
                </div>
                <div class="line-card-amount">
                    <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Win up to</div>
                    <div class="line-amount-num">$${avail.toFixed(0)}</div>
                    <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">risk $${availBettor.toFixed(0)}</div>
                    <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="takeLine(${line.id})" ${isFull?'disabled':''}>
                        ${isFull?'Filled':'Take Bet'}
                    </button>
                </div>
            </div>
        </div>`;
    }
    return html;
    }catch(e){
        console.error('loadLines error:',e);
        return`<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Couldn't load marketplace</div><div class="empty-desc">${e.message||'Connection error'} — <button class="btn btn-outline btn-sm" onclick="changeView('marketplace')">Retry</button></div></div>`;
    }
}
async function takeLine(lineId){
    const line=linesCache.find(l=>l.id===lineId);
    if(!line){toast('Line not found','error');return;}
    const avail=line.amount-(line.total_action||0);
    const availBettor=line.available_for_bettor||avail;
    const odds=line.odds||-110;
    const oddsStr=odds>0?'+'+odds:odds;
    const maxBettor=Math.min(availBettor,line.max_bet_per_user||availBettor,user.balance);
    if(maxBettor<=0){toast('No available action on this line','error');return;}

    const amount=await promptBetAmount(
        `<strong style="color:var(--text)">${line.game}</strong><br>
        ${line.type.toUpperCase()} · ${line.side} ${line.type!=='moneyline'?(line.value>0?'+':'')+line.value:''}<br>
        Odds: <strong style="color:${odds>0?'var(--green)':'var(--text-muted)'}">${oddsStr}</strong><br>
        <span style="color:var(--text-dim);font-size:12px;">Enter how much YOU want to risk. You win $${avail.toFixed(0)} if correct.</span>`,
        maxBettor
    );
    if(!amount)return;

    // Show what they stand to win
    let toWin;
    if(odds<=-100) toWin=(amount*(Math.abs(odds)/100)).toFixed(2);
    else toWin=(amount*(odds/100)).toFixed(2);

    try{
        const res=await fetch(API+'/lines/take?token='+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({line_id:lineId,amount})});
        if(res.ok){
            const data=await res.json();
            toast(`Bet placed! Risk $${amount} → Win $${data.to_win||toWin}  (${oddsStr})`, 'success');
            await loadUser();updateSidebarBalance();refreshBadges();changeView('marketplace');
        }else{const e=await res.json();toast(e.detail||'Error placing bet','error');}
    }catch(e){toast('Connection error','error');}
}
async function renderCreateLine(){
    document.getElementById('content').innerHTML=skeletonCards(1);
    try{
        const [gamesRes, groupsRes]=await Promise.all([
            fetch(API+'/games'),
            fetch(API+'/groups?token='+token)
        ]);
        const games=gamesRes.ok ? await gamesRes.json() : [];
        const groups=groupsRes.ok ? await groupsRes.json() : [];
        if(!Array.isArray(games)) throw new Error('Could not load games from server');
        gamesCache=games;
        const gameOptions=games.map(g=>{
            const time=g.commence_time?new Date(g.commence_time).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):g.date;
            return`<option value="${g.id}">[${g.sport}] ${g.away} @ ${g.home} — ${time}</option>`;
        }).join('');
        const html=`<div class="page-header"><div class="page-title">Set a Line</div><div class="page-subtitle">You're the bookie — set the game, your side, and the odds you'll offer</div></div>
            <div class="card" style="max-width:760px;">
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:10px;">① PICK THE MATCHUP</div>
                <div class="form-group"><label>Select Game</label>
                    <select id="game" onchange="onGameChange()"><option value="">Choose a game...</option>${gameOptions}</select>
                </div>
                <div class="form-grid-3">
                    <div class="form-group" style="margin:0"><label>Bet Type</label><select id="type" onchange="onBetTypeChange()"><option value="spread">Spread</option><option value="moneyline">Moneyline</option><option value="total">Over / Under</option></select></div>
                    <div class="form-group" style="margin:0"><label>Your Side</label><select id="side"><option value="home">Home</option><option value="away">Away</option></select></div>
                    <div class="form-group" style="margin:0" id="valueField"><label>Line Value</label><input id="value" type="number" step="0.5" placeholder="-5.5"></div>
                </div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--text-dim);margin:24px 0 10px;">② SET YOUR ODDS</div>
                <div style="background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:20px;margin-bottom:4px;">
                    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
                        <div style="flex:1;min-width:160px;">
                            <label style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);display:block;margin-bottom:8px;">Your Odds (American)</label>
                            <input id="odds" type="number" step="1" value="-110"
                                style="width:100%;padding:14px 16px;font-size:28px;font-weight:800;font-family:'Barlow Condensed',sans-serif;background:var(--card);border:2px solid var(--border);border-radius:8px;color:var(--text);text-align:center;letter-spacing:1px;">
                            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
                                <button type="button" onclick="setOdds(-110)" class="btn btn-secondary btn-sm">-110</button>
                                <button type="button" onclick="setOdds(-150)" class="btn btn-secondary btn-sm">-150</button>
                                <button type="button" onclick="setOdds(+110)" class="btn btn-secondary btn-sm">+110</button>
                                <button type="button" onclick="setOdds(+150)" class="btn btn-secondary btn-sm">+150</button>
                                <button type="button" onclick="setOdds(+200)" class="btn btn-secondary btn-sm">+200</button>
                            </div>
                            <div style="font-size:11px;color:var(--text-dim);margin-top:8px;line-height:1.5;">
                                <strong style="color:var(--text-muted)">Negative</strong> = you're the favorite · <strong style="color:var(--green)">Positive</strong> = you're the underdog
                            </div>
                        </div>
                        <div style="flex:1;min-width:180px;">
                            <label style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);display:block;margin-bottom:8px;">Your Stake ($)</label>
                            <input id="amount" type="number" placeholder="100" step="1"
                                style="width:100%;padding:14px 16px;font-size:24px;font-weight:700;font-family:'Barlow Condensed',sans-serif;background:var(--card);border:2px solid var(--border);border-radius:8px;color:var(--text);text-align:center;">
                            <div style="font-size:11px;color:var(--text-dim);margin-top:8px;">How much you're risking on this line</div>
                        </div>
                    </div>
                    <div id="oddsPreview" style="margin-top:16px;padding:12px 16px;background:var(--card);border-radius:8px;font-size:14px;color:var(--text-muted);border:1px solid var(--border);min-height:42px;transition:.2s;">
                        Enter odds and amount to see the payout breakdown
                    </div>
                </div>
                <div class="advanced-panel" style="margin-top:16px;">
                    <div class="advanced-title">Advanced Controls</div>
                    <div class="form-grid-3">
                        <div class="form-group" style="margin:0"><label>Max Bettors</label><input id="maxBettors" type="number" placeholder="Unlimited"></div>
                        <div class="form-group" style="margin:0"><label>Max Per User ($)</label><input id="maxBetPerUser" type="number" placeholder="Unlimited"></div>
                        <div class="form-group" style="margin:0"><label>Max Total Action ($)</label><input id="maxTotalAction" type="number" placeholder="Unlimited"></div>
                    </div>
                    <div class="checkbox-row"><input type="checkbox" id="isPrivate" onchange="toggleGroupSelect()"><span>Private Line (Groups Only)</span></div>
                    ${groups.length>0?`<select id="groupId" style="margin-top:10px;display:none;"><option value="">Select a group...</option>${groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select>`:'<small style="color:var(--text-dim);display:block;margin-top:8px;">Create a group first to use private lines</small>'}
                </div>
                <button class="btn btn-primary btn-lg btn-full" style="margin-top:24px;" onclick="createLine()">Post Line to Marketplace ⚡</button>
            </div>`;
        document.getElementById('content').innerHTML=html;
        setTimeout(wireOddsPreview, 50);
        return '';
    }catch(e){
        console.error('renderCreateLine error:',e);
        return`<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Couldn't load Set Lines</div><div class="empty-desc">${e.message||'Connection error'} — <button class="btn btn-outline btn-sm" onclick="changeView('create')">Retry</button></div></div>`;
    }
}

function getSelectedGame(gameSelId){
    const sel=document.getElementById(gameSelId);
    if(!sel||!sel.value)return null;
    return gamesCache.find(g=>g.id===sel.value)||null;
}

function updateSideForGame(gameSelId, sideSelId, betType){
    const side=document.getElementById(sideSelId);
    if(!side)return;
    if(betType==='total'){
        side.innerHTML='<option value="over">Over</option><option value="under">Under</option>';
        return;
    }
    const g=getSelectedGame(gameSelId);
    if(g){
        side.innerHTML=`<option value="home">${g.home}</option><option value="away">${g.away}</option>`;
    } else {
        side.innerHTML='<option value="home">Home</option><option value="away">Away</option>';
    }
}

function onBetTypeChange(){
    const type=document.getElementById('type')?.value;
    const vf=document.getElementById('valueField');
    if(!vf)return;
    if(type==='moneyline'){
        vf.style.display='none';
    } else if(type==='total'){
        vf.style.display='';
        document.getElementById('value').placeholder='224.5';
    } else {
        vf.style.display='';
        document.getElementById('value').placeholder='-5.5';
    }
    updateSideForGame('game','side',type);
}

function onGameChange(){
    const type=document.getElementById('type')?.value||'spread';
    updateSideForGame('game','side',type);
}

function onChallengeTypeChange(){
    const type=document.getElementById('cType')?.value;
    const vf=document.getElementById('cValueField');
    if(!vf)return;
    if(type==='moneyline'){
        vf.style.display='none';
        document.getElementById('cValue').placeholder='-3.5';
    } else if(type==='total'){
        vf.style.display='';
        document.getElementById('cValue').placeholder='224.5';
    } else {
        vf.style.display='';
        document.getElementById('cValue').placeholder='-3.5';
    }
    updateSideForGame('cGame','cSide',type);
}

function onChallengeGameChange(){
    const type=document.getElementById('cType')?.value||'spread';
    updateSideForGame('cGame','cSide',type);
}

function onPropGameChange(){
    // Props always over/under so no home/away needed, but update label for clarity
}

function setOdds(val){
    const inp=document.getElementById('odds');
    if(inp){inp.value=val;calcOddsPreview();}
}
function toggleGroupSelect(){const gs=document.getElementById('groupId'),ip=document.getElementById('isPrivate');if(gs&&ip)gs.style.display=ip.checked?'block':'none';}

function calcOddsPreview(){
    const odds=parseInt(document.getElementById('odds')?.value||'-110');
    const amount=parseFloat(document.getElementById('amount')?.value||'0');
    const preview=document.getElementById('oddsPreview');
    if(!preview)return;
    if(isNaN(odds)||isNaN(amount)||amount<=0||isNaN(odds)||odds===0||(-100<odds&&odds<100)){
        preview.innerHTML='Enter odds and amount to see the payout breakdown';
        preview.style.borderColor='var(--border)';
        return;
    }
    let bettorRisk;
    if(odds<=-100){bettorRisk=+(amount*(100/Math.abs(odds))).toFixed(2);}
    else{bettorRisk=+(amount*(odds/100)).toFixed(2);}
    const oddsStr=odds>0?'+'+odds:odds;
    const oddsColor=odds>0?'var(--green)':'var(--text-muted)';
    preview.style.borderColor=odds>0?'var(--green)':'var(--orange)';
    preview.innerHTML=`
        <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;">
            <div style="text-align:center;">
                <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:4px;">You (Bookie) risk</div>
                <div style="font-size:22px;font-weight:800;font-family:'Barlow Condensed',sans-serif;color:var(--orange);">$${amount}</div>
                <div style="font-size:11px;color:var(--text-dim);">at <strong style="color:${oddsColor}">${oddsStr}</strong></div>
            </div>
            <div style="font-size:24px;color:var(--text-dim);">⚔️</div>
            <div style="text-align:center;">
                <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:4px;">Bettor must risk</div>
                <div style="font-size:22px;font-weight:800;font-family:'Barlow Condensed',sans-serif;color:var(--green);">$${bettorRisk}</div>
                <div style="font-size:11px;color:var(--text-dim);">to take your bet</div>
            </div>
            <div style="font-size:24px;color:var(--text-dim);">→</div>
            <div style="text-align:center;">

async function takeProp(propId){
    const prop=propsCache.find(p=>p.id===propId);
    if(!prop){toast('Prop not found','error');return;}
    const odds=prop.odds||-110;
    const oddsStr=odds>0?'+'+odds:String(odds);
    const oppSide=prop.side==='over'?'under':'over';
    // Bettor stake mirrors the bookie stake at these odds
    let bettorRisk;
    if(odds<=-100) bettorRisk=(prop.amount*(100/Math.abs(odds))).toFixed(2);
    else bettorRisk=(prop.amount*(odds/100)).toFixed(2);
    const ok=await showConfirm(
        `Take this prop?`,
        `${prop.player_name} — ${prop.prop_type} ${oppSide.toUpperCase()} ${prop.line}\nOdds: ${oddsStr}\nYou risk $${bettorRisk} to win $${prop.amount}`
    );
    if(!ok)return;
    try{
        const res=await fetch(API+'/props/take?token='+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prop_id:propId})});
        if(res.ok){
            const data=await res.json();
            toast(`Prop bet placed! Risk $${data.bettor_stake||bettorRisk} → Win $${data.bookie_stake||prop.amount}`,'success');
            await loadUser();updateSidebarBalance();renderApp();
        }
        else{const e=await res.json();toast(e.detail||'Error','error');}
    }catch(e){toast('Connection error','error');}
}

// Fetch pending challenge count and cache it for nav badges
async function refreshBadges() {
    try {
        const [challengeData, friendData] = await Promise.all([
            fetch(API + '/challenges?token=' + token).then(r => r.json()),
            fetch(API + '/friends?token=' + token).then(r => r.json())
        ]);
        window._badges = {
            challengeCount: (challengeData.incoming || []).length,
            friendRequestCount: (friendData.incoming || []).length
        };
    } catch(e) { window._badges = {}; }
}

async function openChallengeModal(username) {
    _challengeTargetUsername = username;
    document.getElementById('challengeTarget').innerHTML =
        `Challenging <strong style="color:var(--text)">@${username}</strong>`;
    if(!gamesCache.length){
        const games = await fetch(API + '/games').then(r => r.json());
        gamesCache = games;
    }
    const sel = document.getElementById('cGame');
    sel.innerHTML = '<option value="">Choose a game...</option>' + gamesCache.map(g => {
        const time = g.commence_time ? new Date(g.commence_time).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : g.date;
        return `<option value="${g.id}">[${g.sport}] ${g.away} @ ${g.home} — ${time}</option>`;
    }).join('');
    sel.onchange = onChallengeGameChange;
    ['cOdds','cAmount'].forEach(id => {
        const el = document.getElementById(id);
        el.removeEventListener('input', updateChallengePreview);
        el.addEventListener('input', updateChallengePreview);
    });
    updateChallengePreview();
    onChallengeTypeChange();
    openModal('challengeModal');
}

function updateChallengePreview() {
    const odds = parseInt(document.getElementById('cOdds')?.value || '-110');
    const amount = parseFloat(document.getElementById('cAmount')?.value || '0');
    const preview = document.getElementById('cOddsPreview');
    if (!preview) return;
    if (isNaN(odds) || isNaN(amount) || amount <= 0) { preview.innerHTML = 'Enter odds and amount to preview'; return; }
    let oppStake;
    if (odds <= -100) oppStake = +(amount * (100 / Math.abs(odds))).toFixed(2);
    else oppStake = +(amount * (odds / 100)).toFixed(2);
    const oddsStr = odds > 0 ? '+' + odds : odds;
    preview.innerHTML = `You risk <strong style="color:var(--orange)">$${amount}</strong> at <strong>${oddsStr}</strong> · @${_challengeTargetUsername} risks <strong style="color:var(--green)">$${oppStake}</strong> · Winner takes <strong style="color:var(--gold)">$${(amount + oppStake).toFixed(2)}</strong>`;
}

async function submitChallenge() {
    const gameId = document.getElementById('cGame').value;
    const type   = document.getElementById('cType').value;
    const side   = document.getElementById('cSide').value;
    const rawVal = document.getElementById('cValue').value;
    const value  = type === 'moneyline' ? 0 : parseFloat(rawVal);
    const odds   = parseInt(document.getElementById('cOdds').value);
    const amount = parseFloat(document.getElementById('cAmount').value);
    const msg    = document.getElementById('cMessage').value.trim();

    if (!gameId || !type || !side) { toast('Fill all required fields', 'error'); return; }
    if (type !== 'moneyline' && isNaN(value)) { toast('Enter a line value for spread / total', 'error'); return; }
    if (isNaN(amount) || amount <= 0) { toast('Enter your stake amount', 'error'); return; }
    if (isNaN(odds) || odds === 0 || (-100 < odds && odds < 100)) { toast('Odds must be ≤ -100 or ≥ +100', 'error'); return; }

    try {
        const res = await fetch(API + '/challenges?token=' + token, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ challenged_username: _challengeTargetUsername, game_id: gameId, type, side, value, odds, amount, message: msg || null })
        });
        if (res.ok) {
            toast(`Challenge sent to @${_challengeTargetUsername}! ⚔️`, 'success');
            closeModal('challengeModal');
            await loadUser(); updateSidebarBalance();
        } else { const e = await res.json(); toast(e.detail || 'Error', 'error'); }
    } catch(e) { toast('Connection error', 'error'); }
}

async function acceptChallenge(id) {
    try {
        const res = await fetch(API + '/challenges/accept?token=' + token, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ challenge_id: id })
        });
        if (res.ok) { toast('Challenge accepted! Bet is live 🔥', 'success'); await loadUser(); updateSidebarBalance(); renderApp(); }
        else { const e = await res.json(); toast(e.detail || 'Error', 'error'); }
    } catch(e) { toast('Connection error', 'error'); }
}

async function declineChallenge(id) {
    try {
        const res = await fetch(API + '/challenges/decline?token=' + token, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ challenge_id: id })
        });
        if (res.ok) { toast('Challenge declined', 'info'); renderApp(); }
        else { const e = await res.json(); toast(e.detail || 'Error', 'error'); }
    } catch(e) { toast('Connection error', 'error'); }
}

async function cancelChallenge(id) {
    const ok = await showConfirm('Cancel challenge?', 'Your stake will be refunded.');
    if (!ok) return;
    try {
        const res = await fetch(API + '/challenges/cancel?token=' + token, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ challenge_id: id })
        });
        if (res.ok) { toast('Challenge cancelled. Stake refunded.', 'info'); await loadUser(); updateSidebarBalance(); renderApp(); }
        else { const e = await res.json(); toast(e.detail || 'Error', 'error'); }
    } catch(e) { toast('Connection error', 'error'); }
}

async function renderChallenges() {
    document.getElementById('content').innerHTML = skeletonCards(3);
    const res = await fetch(API + '/challenges?token=' + token);
    const data = await res.json();

    let html = `<div class="page-header"><div class="page-title">Challenges</div><div class="page-subtitle">Direct PvP — your inbox and sent challenges</div></div>`;

    } else {
        incoming.forEach(c => {
            const oddsStr = c.odds > 0 ? '+' + c.odds : c.odds;
            html += `<div class="card" style="border-color:rgba(255,107,0,.3);">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
                    <div style="flex:1;">
                        <div style="font-size:17px;font-weight:700;">@${c.challenger_name} challenges you</div>
                        <div style="font-size:14px;color:var(--text-muted);margin-top:4px;">${c.game}</div>
                        <div style="font-size:14px;color:var(--text-muted);margin-top:2px;">
                            ${c.type.toUpperCase()} · Their side: <strong style="color:var(--text)">${c.side}</strong>
                            ${c.type !== 'moneyline' ? `<strong style="color:var(--text)"> ${c.value > 0 ? '+' : ''}${c.value}</strong>` : ''}
                            · <span style="color:${c.odds > 0 ? 'var(--green)' : 'var(--text-muted)'};">${oddsStr}</span>
                        </div>
                        <div style="margin-top:8px;font-size:13px;">
                            They risk <strong style="color:var(--orange)">$${c.amount}</strong> · You risk <strong style="color:var(--green)">$${c.bettor_stake}</strong>
                            · Pot: <strong style="color:var(--gold)">$${(c.amount + c.bettor_stake).toFixed(2)}</strong>
                        </div>
                        ${c.message ? `<div style="margin-top:8px;font-style:italic;color:var(--text-muted);font-size:13px;">"${c.message}"</div>` : ''}
                    </div>
                    <div style="display:flex;flex-direction:column;gap:8px;">

                        <button class="btn btn-danger btn-sm" onclick="declineChallenge(${c.id})">Decline</button>
                    </div>
                </div>

    // Outgoing
    html += `<div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;margin:28px 0 12px;color:var(--text-muted);">Sent Challenges</div>`;
    if (!outgoing.length) {
        html += `<div class="card" style="text-align:center;padding:32px;color:var(--muted);">No sent challenges yet — find a bookie to challenge!</div>`;
    } else {
        outgoing.forEach(c => {
            const oddsStr = c.odds > 0 ? '+' + c.odds : c.odds;
            const statusColors = { pending:'var(--gold)', accepted:'var(--green)', declined:'var(--red)', cancelled:'var(--muted)' };
            const statusIcons  = { pending:'⏳', accepted:'✅', declined:'❌', cancelled:'🚫' };
            html += `<div class="card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
                    <div style="flex:1;">
                        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                            <span style="font-size:17px;font-weight:700;">→ @${c.challenged_name}</span>
                            <span style="font-size:12px;font-weight:700;color:${statusColors[c.status]||'var(--muted)'};">${statusIcons[c.status]||''} ${c.status.toUpperCase()}</span>
                        </div>
                        <div style="font-size:14px;color:var(--text-muted);margin-top:4px;">${c.game}</div>
                        <div style="font-size:14px;color:var(--text-muted);margin-top:2px;">
                            ${c.type.toUpperCase()} · Your side: <strong style="color:var(--text)">${c.side}</strong>
                            ${c.type !== 'moneyline' ? `<strong style="color:var(--text)"> ${c.value > 0 ? '+' : ''}${c.value}</strong>` : ''}
                            · <span style="color:${c.odds > 0 ? 'var(--green)' : 'var(--text-muted)'};">${oddsStr}</span>
                        </div>
                        <div style="margin-top:6px;font-size:13px;">Your stake: <strong style="color:var(--orange)">$${c.amount}</strong>${c.message ? ` · "${c.message}"` : ''}</div>
                    </div>

    }
    return html;
}
// ─── CHALLENGES END ────────────────────────────────────────────────────────────

// ─── NOTIFICATIONS ────────────────────────────────────────────────────────────
let _notifPollInterval = null;
let _lastNotifCount = 0;
let _notifications = [];

async function fetchNotifications(silent = false) {
    if (!token) return;
    try {
        const res = await fetch(API + '/notifications?token=' + token);
        if (!res.ok) return;
        const data = await res.json();
        const unread = data.filter(n => !n.is_read);
        const newCount = unread.length;

        // Toast any brand-new ones since last poll
        if (!silent && newCount > _lastNotifCount) {
            const newest = data.find(n => !n.is_read);
            if (newest) toast(`🔔 ${newest.title}`, 'info');
        }

        _lastNotifCount = newCount;
        _notifications = data;
        updateNotifBadge(newCount);

        // If drawer is open, re-render it
        if (document.getElementById('notifDrawer').classList.contains('open')) {
            renderNotifList();
        }
    } catch(e) { /* silent fail */ }
}

function updateNotifBadge(count) {
    const badge = document.getElementById('notifBadge');
    if (!badge) return;
    if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.style.display = 'flex';
    } else {
        badge.style.display = 'none';
    }
}

function renderNotifList() {
    const list = document.getElementById('notifList');
    if (!list) return;
    if (!_notifications.length) {
        list.innerHTML = '<div class="notif-empty"><div class="notif-empty-icon">🔔</div>No notifications yet</div>';
        return;
    }
    list.innerHTML = _notifications.map(n => {
        const ago = timeAgo(n.created_at);
        return `<div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="clickNotif(${n.id}, '${n.type}', ${n.ref_id || 'null'})">
            <div class="notif-item-title">${n.title}</div>
            <div class="notif-item-body">${n.body}</div>
            <div class="notif-item-time">${ago}</div>
        </div>`;
    }).join('');
}

function timeAgo(isoStr) {
    const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
}

async function clickNotif(id, type, refId) {
    // Mark as read
    await fetch(API + '/notifications/read?token=' + token + '&notif_id=' + id, { method: 'POST' });
    _notifications = _notifications.map(n => n.id === id ? {...n, is_read: true} : n);
    _lastNotifCount = _notifications.filter(n => !n.is_read).length;
    updateNotifBadge(_lastNotifCount);
    renderNotifList();

    // Deep-link based on type
    closeNotifDrawer();
    if (type === 'challenge_received' || type === 'challenge_accepted' || type === 'challenge_declined') {
        changeView('challenges');
    } else if (type === 'bet_matched' || type === 'bet_settled') {
        changeView('bets');
    } else if (type === 'friend_request' || type === 'friend_accepted') {
        changeView('friends');
    }
}

async function markAllRead() {
    await fetch(API + '/notifications/read?token=' + token, { method: 'POST' });
    _notifications = _notifications.map(n => ({...n, is_read: true}));
    _lastNotifCount = 0;
    updateNotifBadge(0);
    renderNotifList();
}

function openNotifDrawer() {
    document.getElementById('notifDrawer').classList.add('open');
    document.getElementById('notifOverlay').classList.add('open');
    renderNotifList();
    // Mark all read silently after a moment
    setTimeout(markAllRead, 1500);
}

function closeNotifDrawer() {
    document.getElementById('notifDrawer').classList.remove('open');
    document.getElementById('notifOverlay').classList.remove('open');
}

function startNotifPolling() {
    fetchNotifications(true); // initial fetch, silent
    if (_notifPollInterval) clearInterval(_notifPollInterval);
    _notifPollInterval = setInterval(() => fetchNotifications(false), 20000); // every 20s
}
// ─── NOTIFICATIONS END ────────────────────────────────────────────────────────
